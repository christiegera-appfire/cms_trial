<!-- Real TOC scroll-spy — highlights the currently-visible heading in the
     "On this page" panel as the reader scrolls. Harmless no-op if there's
     no .page-toc on the page (most pages with few/no headings). -->
<script>
(function () {
  var tocLinks = document.querySelectorAll(".page-toc a[href^='#']");
  if (!tocLinks.length) return;

  var headingMap = {};
  var headings = [];
  tocLinks.forEach(function (link) {
    var id = link.getAttribute("href").slice(1);
    var heading = document.getElementById(id);
    if (heading) {
      headingMap[id] = link;
      headings.push(heading);
    }
  });
  if (!headings.length) return;

  var activeLink = null;
  function setActive(id) {
    var link = headingMap[id];
    if (!link || link === activeLink) return;
    if (activeLink) activeLink.classList.remove("active");
    link.classList.add("active");
    activeLink = link;
  }

  // rootMargin biases toward the upper third of the viewport, so a
  // heading is marked "current" once it's crossed into the reading area,
  // not only once it's scrolled to the very top edge.
  var observer = new IntersectionObserver(function (entries) {
    entries.forEach(function (entry) {
      if (entry.isIntersecting) setActive(entry.target.id);
    });
  }, { rootMargin: "-15% 0px -75% 0px", threshold: 0 });

  headings.forEach(function (h) { observer.observe(h); });

  // Sets the first heading active immediately on load, rather than
  // leaving the TOC with nothing highlighted until the reader scrolls.
  setActive(headings[0].id);
})();
</script>
