<!-- Cmd+K (or Ctrl+K) jumps to the search page; if already there, focuses the
     search input instead of navigating. "/" does the same, unless focus is
     already inside a text input/textarea (so typing a literal "/" in a
     search box or form field doesn't get hijacked). -->
<script>
(function () {
  var SEARCH_URL = "__SEARCH_URL__";
  document.addEventListener("keydown", function (e) {
    var isCmdK = (e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k";
    var isSlash = e.key === "/" && !isTypingInField(e.target);
    if (!isCmdK && !isSlash) return;

    e.preventDefault();
    var existingInput = document.getElementById("search-input");
    if (existingInput) {
      existingInput.focus();
    } else {
      window.location.href = SEARCH_URL;
    }
  });

  function isTypingInField(el) {
    if (!el) return false;
    var tag = el.tagName.toLowerCase();
    return tag === "input" || tag === "textarea" || el.isContentEditable;
  }
})();
</script>
