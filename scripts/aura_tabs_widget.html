<!-- Aura Tab Group enhancement — click-to-switch tabs. Harmless to include
     on every page; does nothing if no .aura-tab-group elements exist. -->
<script>
(function () {
  document.querySelectorAll(".aura-tab-group").forEach(function (group) {
    var buttons = group.querySelectorAll(".aura-tab-btn");
    buttons.forEach(function (btn) {
      btn.addEventListener("click", function () {
        var targetId = btn.dataset.target;
        group.querySelectorAll(".aura-tab-btn").forEach(function (b) { b.classList.remove("active"); });
        group.querySelectorAll(".aura-tab-panel").forEach(function (p) { p.classList.remove("active"); });
        btn.classList.add("active");
        var panel = document.getElementById(targetId);
        if (panel) panel.classList.add("active");
      });
    });
  });
})();
</script>
