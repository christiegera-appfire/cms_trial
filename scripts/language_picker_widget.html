<!-- Language picker — links to Google Translate's real, public proxy for
     the CURRENT page (computed client-side from window.location), which
     translates the actual live page on the fly. No API key, no per-
     character cost, works today. Lower polish than a real native
     multi-language site (shows Google's own banner, different domain
     while translated) — a real starting point, not the final answer.

     Languages chosen based on real signal: Atlassian's own cloud docs/
     support content is only actively translated into Japanese beyond
     English (confirmed via their own support documentation) — the
     strongest available signal for what this specific audience actually
     needs — plus the other major enterprise-software markets. -->
<script>
(function () {
  var btn = document.querySelector(".lang-picker-btn");
  var menu = document.querySelector(".lang-picker-menu");
  if (!btn || !menu) return;

  var LANGUAGES = [
    { code: "ja", label: "日本語 (Japanese)" },
    { code: "de", label: "Deutsch (German)" },
    { code: "fr", label: "Français (French)" },
    { code: "es", label: "Español (Spanish)" },
    { code: "pt", label: "Português (Portuguese)" },
    { code: "zh-CN", label: "中文 (Chinese, Simplified)" },
    { code: "pl", label: "Polski (Polish)" },
  ];

  menu.innerHTML = LANGUAGES.map(function (lang) {
    return '<a href="#" data-lang="' + lang.code + '">' + lang.label + "</a>";
  }).join("");

  btn.addEventListener("click", function (e) {
    e.stopPropagation();
    menu.classList.toggle("open");
  });

  document.addEventListener("click", function () {
    menu.classList.remove("open");
  });

  menu.querySelectorAll("a").forEach(function (a) {
    a.addEventListener("click", function (e) {
      e.preventDefault();
      var lang = a.dataset.lang;
      var currentUrl = window.location.href;
      var translateUrl = "https://translate.google.com/translate?sl=en&tl=" + lang + "&u=" + encodeURIComponent(currentUrl);
      window.open(translateUrl, "_blank", "noopener");
      menu.classList.remove("open");
    });
  });
})();
</script>
