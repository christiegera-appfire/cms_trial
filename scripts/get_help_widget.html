<!-- JSM "Get Help" widget — real OAuth 2.0 (3LO) flow against the TJ service desk.
     Styled to match the rest of the site; no third-party embed script involved
     (that path is blocked — see SETUP_JSM.md for why). -->
<button id="get-help-btn" class="get-help-btn" type="button">Get Help</button>

<div id="get-help-modal" class="get-help-modal" hidden>
  <div class="get-help-modal-inner">
    <button id="get-help-close" class="get-help-close" type="button" aria-label="Close">&times;</button>

    <div id="get-help-step-auth">
      <h2>Get Help</h2>
      <p>Submitting a request uses your real Atlassian account — if you're already logged in, this is usually a single click.</p>
      <button id="get-help-authorize" class="get-help-primary-btn" type="button">Continue with Atlassian</button>
    </div>

    <form id="get-help-form" hidden>
      <h2>Submit a request</h2>
      <label for="get-help-summary">Summary</label>
      <input id="get-help-summary" name="summary" type="text" required maxlength="255">
      <label for="get-help-description">Description</label>
      <textarea id="get-help-description" name="description" rows="5" required></textarea>
      <button type="submit" class="get-help-primary-btn">Submit request</button>
      <p id="get-help-status" class="get-help-status" role="status"></p>
    </form>
  </div>
</div>

<script>
(function () {
  // Docs site (GitHub Pages) and JSM functions (Vercel) are on DIFFERENT
  // origins — this is a genuine cross-origin call. The Vercel project's
  // DOCS_SITE_ORIGIN environment variable needs to match wherever this page
  // is actually served from (e.g. https://christiegera-appfire.github.io),
  // or the CORS check in api/submit-request.js will reject the request.
  //
  // Update these two URLs once you know your actual Vercel deployment URL —
  // it'll look like https://your-project-name.vercel.app.
  var OAUTH_START_URL = "https://cms-trial-omega.vercel.app/api/oauth-start";
  var SUBMIT_URL = "https://cms-trial-omega.vercel.app/api/submit-request";
  // Replaced per-space by generate_site.py — each space can route to its own
  // JSM project. Falls back to the backend's default env var if empty.
  var JSM_PROJECT_KEY = "__JSM_PROJECT_KEY__";

  var btn = document.getElementById("get-help-btn");
  var modal = document.getElementById("get-help-modal");
  var closeBtn = document.getElementById("get-help-close");
  var authStep = document.getElementById("get-help-step-auth");
  var authorizeBtn = document.getElementById("get-help-authorize");
  var form = document.getElementById("get-help-form");
  var statusEl = document.getElementById("get-help-status");

  var accessToken = null;

  // If we just came back from Atlassian, the token is sitting in the URL
  // fragment. Grab it once, then scrub the URL bar so it doesn't linger
  // in the address bar or browser history any longer than necessary.
  (function consumeTokenFromFragment() {
    var match = /[#&]access_token=([^&]+)/.exec(window.location.hash);
    if (match) {
      accessToken = decodeURIComponent(match[1]);
      history.replaceState(null, "", window.location.pathname + window.location.search);
      openModal();
      showForm();
    }
  })();

  function openModal() {
    modal.hidden = false;
  }
  function closeModal() {
    modal.hidden = true;
  }
  function showForm() {
    authStep.hidden = true;
    form.hidden = false;
  }
  function showAuth() {
    authStep.hidden = false;
    form.hidden = true;
  }

  btn.addEventListener("click", function () {
    openModal();
    if (accessToken) {
      showForm();
    } else {
      showAuth();
    }
  });

  closeBtn.addEventListener("click", closeModal);
  modal.addEventListener("click", function (e) {
    if (e.target === modal) closeModal();
  });

  authorizeBtn.addEventListener("click", function () {
    var returnTo = window.location.href.split("#")[0];
    window.location.href = OAUTH_START_URL + "?return_to=" + encodeURIComponent(returnTo);
  });

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    if (!accessToken) {
      showAuth();
      return;
    }
    var summary = document.getElementById("get-help-summary").value;
    var description = document.getElementById("get-help-description").value;

    statusEl.textContent = "Submitting…";
    fetch(SUBMIT_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        Authorization: "Bearer " + accessToken,
      },
      body: JSON.stringify({ summary: summary, description: description, projectKey: JSM_PROJECT_KEY || undefined }),
    })
      .then(function (r) { return r.json().then(function (data) { return { ok: r.ok, data: data }; }); })
      .then(function (result) {
        if (result.ok && result.data.success) {
          statusEl.textContent = "Submitted — ticket " + result.data.issueKey + " created.";
          form.reset();
        } else {
          statusEl.textContent = "Something went wrong: " + (result.data.error || "unknown error");
        }
      })
      .catch(function (err) {
        statusEl.textContent = "Network error: " + err.message;
      });
  });
})();
</script>
