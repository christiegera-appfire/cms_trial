<!-- "Get Help" — a plain link to the real, already-working Refined JSM
     portal, at a different path on the SAME domain. No custom OAuth
     backend needed for this: Refined's own JSM integration already
     correctly handles brand-new, first-time visitors in production today,
     which is exactly the case our earlier OAuth-based attempt structurally
     couldn't solve (Atlassian's own consent screen blocks anyone with zero
     prior relationship to the site, before ever reaching JSM). Styled to
     match the rest of the site and left as a same-tab navigation (not
     target="_blank") so clicking it feels like moving to another page on
     one continuous site, not popping open a separate system. -->
<a class="get-help-btn" href="__SUPPORT_PORTAL_URL__">Get Help</a>
