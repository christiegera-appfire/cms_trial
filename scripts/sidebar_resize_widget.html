<!-- Drag-to-resize sidebar. Updates the --sidebar-width custom property
     that the grid layout reads (clamped 200-480px in CSS regardless of
     what gets set here, so a stray value can't break the layout), and
     persists the chosen width in localStorage so it survives page
     navigation instead of resetting on every load. -->
<script>
(function () {
  var handle = document.querySelector(".sidebar-resize-handle");
  if (!handle) return;

  var STORAGE_KEY = "sidebarWidth";
  var saved = localStorage.getItem(STORAGE_KEY);
  if (saved) {
    document.documentElement.style.setProperty("--sidebar-width", saved + "px");
  }

  var dragging = false;
  var startX = 0;
  var startWidth = 0;

  function currentWidth() {
    var sidebar = document.querySelector(".sidebar");
    return sidebar ? sidebar.getBoundingClientRect().width : 288;
  }

  handle.addEventListener("mousedown", function (e) {
    dragging = true;
    startX = e.clientX;
    startWidth = currentWidth();
    handle.classList.add("dragging");
    document.body.style.userSelect = "none";
    e.preventDefault();
  });

  document.addEventListener("mousemove", function (e) {
    if (!dragging) return;
    var newWidth = startWidth + (e.clientX - startX);
    document.documentElement.style.setProperty("--sidebar-width", newWidth + "px");
  });

  document.addEventListener("mouseup", function () {
    if (!dragging) return;
    dragging = false;
    handle.classList.remove("dragging");
    document.body.style.userSelect = "";
    // Read back the actual rendered width (post-clamp) rather than the
    // raw drag value, so a resize past the min/max bound doesn't save an
    // out-of-range number that would just get re-clamped next load anyway.
    localStorage.setItem(STORAGE_KEY, Math.round(currentWidth()));
  });
})();
</script>
