name: Rebuild docs from Confluence

on:
  workflow_dispatch:
    inputs:
      space_key:
        description: 'Space key to rebuild (e.g. PSJC) — leave blank to rebuild everything'
        required: false
        default: ''
  # Triggered by a real Confluence webhook (page created/updated/removed)
  # POSTing to GitHub's repository_dispatch API — this is what makes
  # content staleness a solved problem instead of "someone has to
  # remember to click Run workflow." See the webhook setup notes in this
  # repo's README for the exact Confluence-side configuration.
  repository_dispatch:
    types: [confluence-updated]
  # Real webhook support exists (repository_dispatch below) for whenever
  # that infrastructure gets set up, but for now automatic freshness comes
  # from the schedule below instead — GitHub Pages serving is free
  # regardless of rebuild frequency, so there's no cost reason to hold
  # back on this. Every 6 hours, 4 times a day; adjust the cron expression
  # below if a different cadence is wanted. The manual "Run workflow"
  # button (workflow_dispatch, above) still works too, any time.
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write            # needed to commit the rebuilt HTML back to main

# Now that a real webhook can trigger this automatically (not just a person
# manually clicking Run workflow), multiple rapid triggers are a real
# possibility — several page edits in quick succession, each firing its own
# webhook delivery. Without this, GitHub Actions would happily run them all
# in parallel, and two runs both committing and pushing around the same
# time would produce a genuine git conflict. This queues them instead:
# each additional trigger waits for the current run to finish rather than
# racing it. cancel-in-progress stays false deliberately — a run that's
# already mid-fetch shouldn't be killed partway through and risk leaving
# things in a half-updated state.
concurrency:
  group: rebuild-docs
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 markdownify

      - name: Configure git identity
        run: |
          git config user.name "docs-bot"
          git config user.email "actions@github.com"

      - name: Fetch from Confluence (one space if specified, else everything)
        env:
          CONFLUENCE_EMAIL: ${{ secrets.CONFLUENCE_EMAIL }}
          CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
        run: |
          # Two possible sources for a target space: a manual workflow_dispatch
          # input, or a real webhook's client_payload telling us which space
          # actually changed (if the webhook is configured to include it) —
          # whichever is present wins; neither present means rebuild everything.
          TARGET_SPACE="${{ github.event.inputs.space_key }}${{ github.event.client_payload.space_key }}"
          if [ -n "$TARGET_SPACE" ]; then
            echo "Fetching only $TARGET_SPACE — other spaces' cached data is untouched."
            python3 scripts/fetch_confluence.py --config sites.json --only-space "$TARGET_SPACE" --commit-incrementally
          else
            python3 scripts/fetch_confluence.py --config sites.json --commit-incrementally
          fi

      # This step always rebuilds every configured space from whatever's
      # cached in data/ — it's fast and purely local, no network calls, so
      # it's safe to run in full even when only one space's data was just
      # refreshed above by the fetch step.
      - name: Build static site (all spaces, from cached data)
        run: |
          python3 scripts/generate_site.py --config sites.json --out .

      - name: Commit and push if anything changed
        run: |
          git config user.name "docs-bot"
          git config user.email "actions@github.com"
          git add -A -- '*.html' '*.md' 'data' 'assets'
          # These are root-level generated files that don't always exist —
          # sitemap.xml specifically only gets written when noindex is off.
          # Adding a named file that doesn't exist anywhere is a fatal git
          # error (confirmed the hard way), unlike a directory pathspec with
          # nothing new in it, so each one needs an existence check first.
          [ -f search-index.json ] && git add search-index.json
          [ -f robots.txt ] && git add robots.txt
          [ -f sitemap.xml ] && git add sitemap.xml
          [ -f llms.txt ] && git add llms.txt
          if git diff --cached --quiet; then
            echo "No content changes — skipping commit."
          else
            git commit -m "Rebuild from Confluence ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          fi
