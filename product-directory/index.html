  <style>
    :root {
      --font: "area", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --bg:            #0b0f16;
      --bg-2:          #0a0d13;
      --border:        rgba(215,222,234,.14);
      --border-strong: rgba(215,222,234,.26);
      --text:          #ffffff;
      --text-muted:    rgba(255,255,255,.5);
      --shadow-sm:     0 2px 8px rgba(0,0,0,.18);
      --shadow-md:     0 8px 28px rgba(0,0,0,.35);
      --radius:        18px;
      --primary-soft:  rgba(47,107,255,.18);
      --color-ac:  #397BFF;
      --color-adc: #A78BFA;
      --color-ms:  #FF8A5B;
      --color-sf:  #63E6E2;
      --color-sl:  #FFE08A;
      --color-mo:  #6875f5;
      --color-sei: #22C55E;
      --color-nt:  rgba(215,222,234,.16);
    }

    body, .card p, .card h3, .kb-card p, .kb-card h3,
.card-excerpt, .results-count, .meta-space,
.sidebar-heading, .space-name, .card-title,
.hint, .meta, .name {
  font-weight: 700 !important;
}

.name { font-size: .9rem !important; }
    
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; min-height: 100vh; margin: 0; }
    body { font-family: var(--font); color: #fff; background-color: var(--bg); }
    a { color: inherit; text-decoration: none; }
    #appfire-directory { font-family: var(--font); }
    .wrap { max-width: 1400px; margin: 0 auto; padding: 0 20px 80px; }
    .controls {
      background-color: #090a0f;
      border-radius: 24px;
      padding-bottom: 24px; box-shadow: var(--shadow-sm); backdrop-filter: blur(6px);
    }
    .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
    .search {
      flex: 1 1 340px; display: flex; gap: 10px; align-items: center;
      background: rgba(9,10,15,1); border-radius: 500px; padding: 10px 12px;
      border: 1px solid #fff;
    }
    .search input {
      width: 100%; border: none; outline: none; font-size: 14px;
      background: transparent; color: #fff; font-family: var(--font);
    }
    .search input::placeholder { color: rgba(255,255,255,.5); }
    .btn {
      border: 1px solid var(--border); background: rgba(215,222,234,.08); color: #fff;
      border-radius: 999px; padding: 8px 12px; font-size: 13px; font-weight: 600;
      font-family: var(--font); cursor: pointer;
      transition: transform .12s ease, background .15s ease; white-space: nowrap;
    }
    .btn:hover { background: rgba(215,222,234,.12); transform: translateY(-1px); }
    .toggle { display: flex; gap: 10px; align-items: center; flex: 0 0 auto; color: rgba(255,255,255,.6); font-size: 13px; }
    .toggle strong { color: #fff; }
    .toggle .pill {
      display: inline-flex; border: 1px solid var(--border); border-radius: 999px;
      overflow: hidden; background: rgba(12,19,32,.55);
    }
    .toggle button {
      border: none; background: transparent; padding: 9px 12px; cursor: pointer;
      font-weight: 700; font-size: 12px; font-family: var(--font);
      color: #fff; transition: background .18s ease, color .18s ease;
    }
    .toggle button.is-active { background: #336fe6; color: #fff; }
    .filters { margin-top: 14px; display: flex; gap: 8px 24px; flex-wrap: wrap; align-items: center; }
    .chip {
      display: inline-flex; align-items: center; gap: 9px;
      cursor: pointer; user-select: none; color: #fff;
    }
    .chip input { display: none; }
    .chip .check {
      width: 14px; height: 14px; min-width: 14px; flex-shrink: 0;
      border-radius: 2px; border: 1px solid #4466FF;
      background: transparent; display: inline-flex; align-items: center; justify-content: center;
      transition: background .15s ease;
    }
    .chip input:checked ~ .check {
      background: #4466FF;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 10 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 4l3 3 5-6' stroke='%23fff' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
      background-repeat: no-repeat; background-position: center; background-size: 9px 7px;
    }
    .chip .label-text { font-size: 13px; font-weight: 400; color: #fff; }
    .chip:hover .label-text { color: #fff; }
    .chip input:checked ~ .label-text { color: #fff; }
    .meta { margin-top: 12px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; color: rgba(255,255,255,.6) !important; font-size: 13px; }
    .meta strong { color: #fff !important; }
    .grid { margin-top: 8px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    @media (max-width: 980px) { .grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 620px) { .grid { grid-template-columns: 1fr; } }

    .card {
      display: flex; flex-direction: column; background: #121213;
      border: 1px solid #5c5b5e; border-radius: 20px; overflow: hidden;
      box-shadow: var(--shadow-sm); backdrop-filter: blur(6px);
    }
    .card-body { flex: 1; padding: 18px 18px 18px; }
    .name { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.3; color: #fff !important; font-family: var(--font) !important; }
    .tags { margin-top: 12px; display: flex; gap: 6px; flex-wrap: wrap; }

    .tag {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 11px; font-weight: 600; font-family: var(--font) !important;
      border-radius: 0; padding: 3px 9px;
      background: transparent; letter-spacing: .01em;
      border: 1px solid rgba(215,222,234,.18); color: #ffffff;
      text-decoration: none;
      transition: background .15s ease, border-color .15s ease, transform .15s ease;
    }
    .tag[href="#"], .tag:not([href]) { cursor: default; pointer-events: none; }

    .tag .tag-arrow {
      width: 9px; height: 9px; flex-shrink: 0; opacity: 0;
      transition: opacity .15s ease, transform .15s ease;
    }
    .tag:hover .tag-arrow { opacity: 1; transform: translateX(2px); }

    .tag.p-ac  { border-color: var(--color-ac);  color: #fff; }
    .tag.p-adc { border-color: var(--color-adc); color: #fff; }
    .tag.p-ms  { border-color: var(--color-ms);  color: #fff; }
    .tag.p-sf  { border-color: var(--color-sf);  color: #fff; }
    .tag.p-sl  { border-color: var(--color-sl);  color: #fff; }
    .tag.p-mo  { border-color: var(--color-mo);  color: #fff; }
    .tag.p-sei { border-color: var(--color-sei); color: #fff; }
    .tag.p-nt  { border-color: var(--color-nt); }

    .tag.p-ac:hover  { background: rgba(57,123,255,0.28);  border-color: #6b9fff; color: #fff; transform: translateY(-2px); }
    .tag.p-adc:hover { background: rgba(167,139,250,0.28); border-color: #c4b0fd; color: #fff; transform: translateY(-2px); }
    .tag.p-ms:hover  { background: rgba(255,138,91,0.28);  border-color: #ffaa80; color: #fff; transform: translateY(-2px); }
    .tag.p-sf:hover  { background: rgba(99,230,226,0.28);  border-color: #8eecea; color: #fff; transform: translateY(-2px); }
    .tag.p-sl:hover  { background: rgba(255,224,138,0.28); border-color: #ffe9a0; color: #fff; transform: translateY(-2px); }
    .tag.p-mo:hover  { background: rgba(104,117,245,0.28); border-color: #9099f7; color: #fff; transform: translateY(-2px); }
    .tag.p-sei:hover { background: rgba(34,197,94,0.28);   border-color: #4ade80; color: #fff; transform: translateY(-2px); }

    .empty { margin-top: 20px; font-size: 18px; color: #fff; }
    .hint { margin: 10px 0 30px; font-size: 13px; color: rgba(255,255,255,.55) !important; line-height: 1.5; }

<div id="appfire-directory">
  <div class="wrap">
    <div class="controls">
      <div class="row">
        <div class="search" role="search">
          <input id="afd-q" type="search" placeholder="Filter apps…" autocomplete="off" />
          <button class="btn" id="afd-clear">Clear</button>
        </div>
        <div class="toggle" aria-label="Match mode">
          <strong>Match:</strong>
          <div class="pill" role="group">
            <button type="button" id="afd-modeAnd" class="is-active">AND</button>
            <button type="button" id="afd-modeOr">OR</button>
          </div>
        </div>
      </div>
      <div class="filters" aria-label="Platform filters">
        <label class="chip"><input type="checkbox" class="afd-filter" value="atlassian-cloud" /><span class="check"></span><span class="label-text">Atlassian Cloud</span></label>
        <label class="chip"><input type="checkbox" class="afd-filter" value="atlassian-dc" /><span class="check"></span><span class="label-text">Atlassian Data Center</span></label>
        <label class="chip"><input type="checkbox" class="afd-filter" value="microsoft" /><span class="check"></span><span class="label-text">Microsoft</span></label>
        <label class="chip"><input type="checkbox" class="afd-filter" value="salesforce" /><span class="check"></span><span class="label-text">Salesforce</span></label>
        <label class="chip"><input type="checkbox" class="afd-filter" value="slack" /><span class="check"></span><span class="label-text">Slack</span></label>
        <label class="chip"><input type="checkbox" class="afd-filter" value="monday" /><span class="check"></span><span class="label-text">monday.com</span></label>
        <label class="chip"><input type="checkbox" class="afd-filter" value="SEI" /><span class="check"></span><span class="label-text">Software Engineering Intelligence</span></label>
      </div>
      <div class="meta">
        <div><strong id="afd-shown">0</strong> shown / <span id="afd-total">0</span> total</div>
      </div>
    </div>
    <p class="hint" id="afd-hint">Filter by platform or search by app name, feature, or space key. Click a platform badge to go directly to that app's documentation.</p>
    <div id="afd-grid" class="grid" aria-label="Apps"></div>
    <div id="afd-empty" class="empty" hidden>No matches. Try clearing filters or changing OR/AND.</div>
  </div>
</div>

    { name: "SIL Tempo Connector", externalUrl: "https://support.appfire.com/space/PSJ/15486620/get-started", platforms: ["atlassian-dc"], keywords: "power suite SIL tempo" },
    { name: "Snippets for Bitbucket", spaceKey: "SNIP", platforms: ["atlassian-dc"] },
    { name: "Source Editor for Confluence", spaceKey: "SOURCE", platforms: ["atlassian-cloud", "atlassian-dc"] },
    { name: "Spacetree for Confluence", spaceKey: "SPACE", platforms: ["atlassian-dc"] },
    { name: "SQL for Confluence (Pro Edition)", spaceKey: "SQL", platforms: ["atlassian-cloud", "atlassian-dc"], keywords: "SQL confluence" },
    { name: "Survey and Vote Macros", spaceKey: "SURVOTE", platforms: ["atlassian-dc"], keywords: "survey vote" },
    { name: "Surveys for Jira – Jira Customer Surveys", spaceKey: "SRV", platforms: ["atlassian-cloud", "atlassian-dc"], keywords: "surveys jira" },
    { name: "Swanly: Portfolio Roadmaps Structure Gantt, Release Timeline", spaceKey: "SRTFJ", platforms: ["atlassian-cloud"], keywords: "swanly roadmap gantt" },
    { name: "Tableau Connector Pro for Jira", spaceKey: "ATCFJ", platforms: ["atlassian-cloud", "atlassian-dc"], keywords: "tableau connector" },
    { name: "TFS4JIRA Azure DevOps integration", spaceKey: "TFS4JIRA", platforms: ["atlassian-cloud", "atlassian-dc", "microsoft"], keywords: "TFS azure devops" },
    { name: "Time to SLA for Jira", platforms: [
        { id: "atlassian-cloud", spaceKey: "TTSC" },
        { id: "atlassian-dc",    spaceKey: "TTS" }
      ], keywords: "SLA time"
    },
    { name: "Timesheets for Jira", spaceKey: "ART", platforms: ["atlassian-cloud", "atlassian-dc"], keywords: "timesheets" },
    { name: "Toggl Integration for Jira", spaceKey: "TJC", platforms: ["atlassian-cloud"], keywords: "toggl time tracking" },
    { name: "Update on Transition for Jira", spaceKey: "CW", platforms: ["atlassian-dc"] },
    { name: "Visibility for Confluence", platforms: [
        { id: "atlassian-cloud", spaceKey: "VISC" },
        { id: "atlassian-dc",    spaceKey: "VISS" }
      ], keywords: "visibility confluence"
    },
    { name: "Visio for Confluence", spaceKey: "CVP", platforms: ["atlassian-dc", "microsoft"], keywords: "visio confluence" },
    { name: "Webhook to Jenkins for Bitbucket", spaceKey: "JENK", platforms: ["atlassian-dc"], keywords: "webhook jenkins bitbucket" },
    { name: "Yet Another Commit Checker", spaceKey: "YACC", platforms: ["atlassian-dc"], keywords: "YACC commit checker bitbucket" },
  ];

  var PLATFORM_LABELS = {
    "atlassian-cloud": { label: "Atlassian Cloud", cls: "p-ac"  },
    "atlassian-dc":    { label: "Atlassian DC",    cls: "p-adc" },
    "microsoft":       { label: "Microsoft",       cls: "p-ms"  },
    "salesforce":      { label: "Salesforce",      cls: "p-sf"  },
    "slack":           { label: "Slack",           cls: "p-sl"  },
    "monday":          { label: "monday.com",      cls: "p-mo"  },
    "SEI":             { label: "Software Engineering Intelligence", cls: "p-sei" },
    "needs-tagging":   { label: "Needs tagging",   cls: "p-nt"  },
  };

  var PLATFORM_ORDER = ["atlassian-cloud","atlassian-dc","microsoft","monday","salesforce","slack","SEI","needs-tagging"];

  var ARROW_SVG = '<svg class="tag-arrow" viewBox="0 0 10 10" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M2 5h6M5 2l3 3-3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  var matchMode = "AND";

  function esc(s) {
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  function normalisePlatforms(app) {
    return (app.platforms && app.platforms.length ? app.platforms : ["needs-tagging"])
      .map(function(p) {
        if (typeof p === "string") return { id: p };
        return p;
      });
  }

  function resolveUrl(entry, app) {
    if (entry.externalUrl) return entry.externalUrl;
    if (app.externalUrl)   return app.externalUrl;
    var key = entry.spaceKey || app.spaceKey;
    if (key) return gsUrl(key);
    return null;
  }

  function getPlatformIds(app) {
    return normalisePlatforms(app).map(function(p) { return p.id; });
  }

  function getFilters() {
    return Array.from(document.querySelectorAll(".afd-filter:checked")).map(function(i){ return i.value; });
  }

  function matches(app, filters, query) {
    var q = query.trim().toLowerCase();
    if (q) {
      var searchText = [
        app.name,
        app.spaceKey || "",
        app.keywords || "",
        normalisePlatforms(app).map(function(p){ return p.spaceKey || ""; }).join(" ")
      ].join(" ").toLowerCase();
      if (searchText.indexOf(q) === -1) return false;
    }
    if (!filters.length) return true;
    var plats = getPlatformIds(app);
    if (matchMode === "OR")  return filters.some(function(f){ return plats.indexOf(f) !== -1; });
    if (matchMode === "AND") return filters.every(function(f){ return plats.indexOf(f) !== -1; });
    return true;
  }

  function render() {
    var grid  = document.getElementById("afd-grid");
    var empty = document.getElementById("afd-empty");
    var qEl   = document.getElementById("afd-q");
    var shown = document.getElementById("afd-shown");
    var total = document.getElementById("afd-total");
    if (!grid || !qEl) return;

    var filters = getFilters();
    var query   = qEl.value || "";
    var visible = APPS.filter(function(app){ return matches(app, filters, query); });

    grid.innerHTML = visible.map(function(app) {
      var entries = normalisePlatforms(app).slice().sort(function(a, b) {
        return PLATFORM_ORDER.indexOf(a.id) - PLATFORM_ORDER.indexOf(b.id);
      });

      var tags = entries.map(function(entry) {
        var meta  = PLATFORM_LABELS[entry.id] || { label: entry.id, cls: "" };
        var label = entry.label || meta.label;
        var url   = resolveUrl(entry, app);
        if (url) {
          return '<a class="tag ' + meta.cls + '" href="' + esc(url) + '" target="_top">'
               + esc(label) + ARROW_SVG + '</a>';
        } else {
          return '<span class="tag ' + meta.cls + '">' + esc(label) + '</span>';
        }
      }).join("");

      return '<div class="card">'
           + '<div class="card-body">'
           + '<h3 class="name">' + esc(app.name) + '</h3>'
           + '<div class="tags">' + tags + '</div>'
           + '</div>'
           + '</div>';
    }).join("");

    if (total) total.textContent = String(APPS.length);
    if (shown) shown.textContent = String(visible.length);
    if (empty) empty.hidden = visible.length > 0;
  }

  function setMode(mode) {
    matchMode = mode;
    var orBtn  = document.getElementById("afd-modeOr");
    var andBtn = document.getElementById("afd-modeAnd");
    if (orBtn)  orBtn.classList.toggle("is-active",  mode === "OR");
    if (andBtn) andBtn.classList.toggle("is-active", mode === "AND");
    render();
  }

  if (!window.__afdListeners) {
    window.__afdListeners = true;
    document.addEventListener("input", function(e) {
      if (e.target && e.target.id === "afd-q") render();
    });
    document.addEventListener("change", function(e) {
      if (e.target && e.target.classList.contains("afd-filter")) render();
    });
    document.addEventListener("click", function(e) {
      if (!e.target) return;
      var id = e.target.id;
      if (id === "afd-clear") {
        var qEl = document.getElementById("afd-q");
        if (qEl) { qEl.value = ""; qEl.focus(); }
        render();
      }
      if (id === "afd-modeOr")  setMode("OR");
      if (id === "afd-modeAnd") setMode("AND");
    });
  }

  function watchGrid() {
    var g = document.getElementById("afd-grid");
    if (!g) return;
    var obs = new MutationObserver(function() {
      if (g.children.length === 0) {
        obs.disconnect();
        render();
        watchGrid();
      }
    });
    obs.observe(g, { childList: true });
  }
  watchGrid();
  render();

  (function() {
    var DARK = "#0b0f16";
    document.documentElement.style.setProperty("background-color", DARK, "important");
    document.body.style.setProperty("background-color", DARK, "important");
  }());

})();
</script>
</body>
